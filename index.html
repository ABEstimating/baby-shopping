<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WLA Baby">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="modern.css">
<title>WLA Baby</title>
</head>
<body>
<section class="hero" aria-label="WLA Baby welcome">
  <img src="wla-family-hero.jpg" alt="WLA Baby family cover">
  <button id="scrollCue" class="scroll-cue" type="button" aria-label="Scroll to shop"><span>⌃</span>Scroll up</button>
</section>
<section id="shop" class="shop">
  <header class="shop-head">
    <div class="logo-wrap"><img src="icon.svg" alt="WLA Baby"></div>
    <label class="search-row"><span>⌕</span><input id="search" type="search" placeholder="Search products" autocomplete="off"></label>
    <div id="categories" class="categories" aria-label="Product categories"></div>
  </header>
  <main class="results">
    <div class="results-head"><h2>Top picks</h2><small id="resultCount"></small></div>
    <div id="grid" class="grid"></div>
  </main>
  <footer class="install">WLA Baby • prices are snapshots • tap Amazon for current price and delivery</footer>
</section>
<script src="modern.js"></script>
</body>
</html>
