<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Baby Shop">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Baby Shop</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">BABY SHOP</p>
        <h1 id="pageTitle">Categories</h1>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="icon-btn install-btn" aria-label="Add to Home Screen">＋</button>
        <button id="searchBtn" class="icon-btn" aria-label="Search">⌕</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="App navigation">
      <button data-tab="home" class="nav-btn active"><span>⌂</span><small>Home</small></button>
      <button data-tab="categories" class="nav-btn"><span>▦</span><small>Categories</small></button>
      <button data-tab="checklist" class="nav-btn"><span>✓</span><small>Checklist</small></button>
      <button data-tab="saved" class="nav-btn"><span>♡</span><small>Saved</small></button>
      <button data-tab="more" class="nav-btn"><span>•••</span><small>More</small></button>
    </nav>
  </div>

  <div id="searchSheet" class="sheet-backdrop hidden">
    <section class="sheet search-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2>Search products</h2><button class="close-sheet">×</button></div>
      <input id="globalSearch" class="search-input" type="search" placeholder="Search crib, bottles, diapers…" autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </section>
  </div>

  <div id="detailSheet" class="sheet-backdrop hidden">
    <section class="sheet detail-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><button id="detailBack" class="text-btn">‹ Back</button><button id="detailSave" class="heart-btn">♡</button></div>
      <div id="detailContent"></div>
    </section>
  </div>

  <div id="installSheet" class="sheet-backdrop hidden">
    <section class="sheet install-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2>Add Baby Shop to iPhone</h2><button class="close-sheet">×</button></div>
      <div class="install-icon">↥</div>
      <ol class="install-steps">
        <li>Open this site in <strong>Safari</strong>.</li>
        <li>Tap the <strong>Share</strong> button <span class="share-symbol">↥</span>.</li>
        <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
        <li>Tap <strong>Add</strong>. It will open like an app.</li>
      </ol>
      <button id="copyUrlBtn" class="primary-btn">Copy Website Link</button>
      <p id="installNote" class="fine-print"></p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
