<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist">
<link rel="manifest" href="manifest.json?v=20260913-2">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=20260913-2">
<link rel="apple-touch-icon" href="icon.svg?v=20260913-2">
<link rel="stylesheet" href="modern.css?v=20260913-2">
<title>My Checklist</title>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
if('caches' in window){caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});}
</script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg?v=20260913-2" alt="Checklist icon">
      <div><h1>My Checklist</h1><p id="summary">0 items left</p></div>
    </div>
    <button id="archiveBtn" class="secondary" type="button">Show Archive</button>
  </header>

  <nav id="timeTabs" class="tabs" aria-label="Time period"></nav>

  <main>
    <section id="activeView">
      <div id="groups" class="groups"></div>
    </section>

    <section id="archiveView" class="hidden">
      <div class="section-heading">
        <div><h2>Completed</h2><p>Finished items stay here until you restore or clear them.</p></div>
        <button id="clearArchive" class="danger-link" type="button">Clear Archive</button>
      </div>
      <div id="archiveList" class="archive-list"></div>
    </section>
  </main>

  <button id="addFab" class="fab" type="button" aria-label="Add checklist item">+</button>
</div>

<div id="addModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <div class="modal-card">
    <div class="modal-head"><h2 id="addTitle">Add Item</h2><button id="closeModal" type="button" aria-label="Close">×</button></div>
    <label>Item<input id="taskInput" type="text" placeholder="What needs to get done?"></label>
    <label>When<select id="periodInput"><option>Today</option><option>This Week</option><option>This Month</option><option>This Year</option></select></label>
    <label>Category<input id="categoryInput" type="text" placeholder="e.g. Pets, Housework"></label>
    <button id="saveTask" class="primary" type="button">Add to Checklist</button>
  </div>
</div>

<script src="modern.js?v=20260913-2"></script>
</body>
</html>
